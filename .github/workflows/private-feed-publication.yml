name: Private feed publication

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      confirm_full_publication:
        description: Confirm publication of every allowlisted private feed route
        required: true
        default: false
        type: boolean
      repair_linkedin_baseline:
        description: Restore the allowlisted 2026-07-27 LinkedIn baseline after R2 hydration
        required: true
        default: false
        type: boolean

concurrency:
  group: private-feed-r2-publication
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  publish-full:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_full_publication == true) ||
      (github.event_name == 'schedule' &&
       vars.PRIVATE_FEED_FULL_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: private-feed-pilot
    env:
      FEED_BASE_URL: https://feeds.paulofehlauer.com
      CANARY_FEED_FILE: ${{ vars.PRIVATE_FEED_FULL_CANARY_FEED_FILE }}
      PRIVATE_FEED_ENDPOINT: https://feeds.paulofehlauer.com
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}

    steps:
      - name: Check out public source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-private.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-private.txt

      - name: Validate non-secret production configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$FEED_BASE_URL" = "https://feeds.paulofehlauer.com"
          test "$PRIVATE_FEED_ENDPOINT" = "$FEED_BASE_URL"
          test -n "$CANARY_FEED_FILE"
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET"

      - name: Stage the approved LinkedIn repair baseline
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.repair_linkedin_baseline == true
        run: >-
          python scripts/repair_linkedin_baseline.py stage
          --stage-dir "$RUNNER_TEMP/private-feed-linkedin-repair"

      - name: Hydrate the active private snapshot
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/hydrate_private_state.py

      - name: Restore the approved LinkedIn repair baseline
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.repair_linkedin_baseline == true
        run: >-
          python scripts/repair_linkedin_baseline.py restore
          --stage-dir "$RUNNER_TEMP/private-feed-linkedin-repair"

      - name: Generate feeds from the hydrated state
        run: python main.py

      - name: Validate and stage the complete snapshot
        id: snapshot
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PRIVATE_FEED_USERNAME: ${{ secrets.PRIVATE_FEED_USERNAME }}
          PRIVATE_FEED_PASSWORD: ${{ secrets.PRIVATE_FEED_PASSWORD }}
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          python scripts/build_snapshot_manifest.py \
            --feed-base-url "$FEED_BASE_URL" \
            --mode full \
            --canary-feed-file "$CANARY_FEED_FILE" \
            --run-id "$run_id" \
            --secret-env R2_ACCESS_KEY_ID \
            --secret-env R2_SECRET_ACCESS_KEY \
            --secret-env PRIVATE_FEED_USERNAME \
            --secret-env PRIVATE_FEED_PASSWORD
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "snapshot_dir=.private-feed-build/$run_id" >> "$GITHUB_OUTPUT"

      - name: Upload, activate, canary and retain
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PRIVATE_FEED_USERNAME: ${{ secrets.PRIVATE_FEED_USERNAME }}
          PRIVATE_FEED_PASSWORD: ${{ secrets.PRIVATE_FEED_PASSWORD }}
        run: >-
          python scripts/publish_snapshot.py
          --snapshot-dir "${{ steps.snapshot.outputs.snapshot_dir }}"
          --feed-base-url "$FEED_BASE_URL"
          --mode full
          --endpoint "$PRIVATE_FEED_ENDPOINT"
          --retention 28
          --secret-env R2_ACCESS_KEY_ID
          --secret-env R2_SECRET_ACCESS_KEY
          --secret-env PRIVATE_FEED_USERNAME
          --secret-env PRIVATE_FEED_PASSWORD

      - name: Record a secret-free summary
        shell: bash
        run: |
          {
            echo "### Private feed publication"
            echo ""
            echo "- Snapshot: \`${{ steps.snapshot.outputs.run_id }}\`"
            echo "- Mode: full"
            echo "- Endpoint: \`$FEED_BASE_URL\`"
            echo "- Canary feed: \`/feeds/$CANARY_FEED_FILE\`"
            echo "- LinkedIn baseline repair: \`${{ github.event_name == 'workflow_dispatch' && inputs.repair_linkedin_baseline == true }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
